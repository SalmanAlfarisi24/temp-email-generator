<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neko Mail Pro ><</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Neko Mail Pro <span class="sub">temp-mail + custom alias</span></h1>
            <div class="status">
                <span id="socketStatus" class="offline">● offline</span>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="temp">Temp Mail</button>
            <button class="tab-btn" data-tab="alias">Custom Alias</button>
        </div>

        <!-- TAB TEMP MAIL -->
        <div id="tab-temp" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h3>📧 Email Sementara</h3>
                    <div class="actions">
                        <button id="generateBtn" class="btn primary">Generate Baru</button>
                        <button id="refreshBtn" class="btn secondary">↻ Refresh</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="email-display">
                        <span id="currentEmail" class="email-text">-</span>
                        <button id="copyBtn" class="btn small">Copy</button>
                    </div>
                    <div id="domainSelector" class="domain-selector">
                        <label>Pilih domain:</label>
                        <select id="domainSelect"></select>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>📥 Inbox</h3>
                    <span id="messageCount" class="badge">0</span>
                </div>
                <div class="card-body">
                    <div id="inboxList" class="inbox-list">
                        <div class="empty-state">Belum ada pesan. Tunggu atau refresh manual ><</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB CUSTOM ALIAS -->
        <div id="tab-alias" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3>🔗 Custom Domain Alias</h3>
                </div>
                <div class="card-body">
                    <form id="aliasForm">
                        <div class="form-group">
                            <label>Domain (milik kamu)</label>
                            <input type="text" id="aliasDomain" placeholder="mail.kamu.com" required>
                        </div>
                        <div class="form-group">
                            <label>Prefix alias</label>
                            <input type="text" id="aliasPrefix" placeholder="verifikasi" required>
                        </div>
                        <div class="form-group">
                            <label>Forward ke email utama</label>
                            <input type="email" id="aliasForward" placeholder="kamu@gmail.com" required>
                        </div>
                        <button type="submit" class="btn primary">Buat Alias</button>
                    </form>
                    <div id="aliasList" class="alias-list">
                        <div class="empty-state">Belum ada alias dibuat.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/tempMail.js"></script>
    <script src="/js/alias.js"></script>
</body>
</html>
